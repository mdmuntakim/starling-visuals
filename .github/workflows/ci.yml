name: ci

on:
  push:
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the archive
        run: bash build.sh
      - name: Check the archive
        run: |
          unzip -t dist/StarlingVisuals.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive = zipfile.ZipFile("dist/StarlingVisuals.zip")
          names = set(archive.namelist())
          for required in ["shaders/shaders.properties", "shaders/noise.png", "shaders/program/final.glsl"]:
              assert required in names, required
          props = archive.read("shaders/shaders.properties").decode()
          for profile in ("profile.LOW =", "profile.HIGH =", "profile.ULTRA ="):
              assert profile in props, profile
          assert len(archive.read("shaders/noise.png")) > 100_000
          print(f"{len(names)} files, {Path('dist/StarlingVisuals.zip').stat().st_size} bytes")
          PY
      - name: Read the pack with Starling's translator
        run: |
          git clone --depth 1 https://github.com/mdmuntakim/minecraft ../minecraft
          cargo build --release --manifest-path ../minecraft/Cargo.toml -p horizon-shaders --example pack_report
          ../minecraft/target/release/examples/pack_report dist/StarlingVisuals.zip \
            --programs --backends --stress --example 3
