# mc_Entity ids Starling Visuals 2 reads. The numbers are the pack's own; they go into
# mc_Entity.x for the programs, which is why they start at 10001.

# Water: its surface reflects the sky and its sides stay flat.
block.10001 = minecraft:water minecraft:flowing_water

# Thin plants: lit from both sides, their normals point anywhere, and the wind moves them.
block.10002 = minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern \
    minecraft:seagrass minecraft:tall_seagrass minecraft:sugar_cane minecraft:vine minecraft:dead_bush \
    minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet \
    minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip \
    minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:sunflower \
    minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:wheat minecraft:carrots \
    minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush minecraft:bush \
    minecraft:short_dry_grass minecraft:tall_dry_grass minecraft:torchflower minecraft:pitcher_plant \
    minecraft:pink_petals minecraft:wildflowers minecraft:leaf_litter

# Leaves: lit from both sides too, and they move a little less than grass.
block.10003 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves \
    minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves \
    minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves \
    minecraft:flowering_azalea_leaves minecraft:pale_oak_leaves

# Cold light: a white or cyan source whose own texture is the light.
block.10004 = minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight \
    minecraft:jack_o_lantern minecraft:beacon minecraft:conduit minecraft:end_rod \
    minecraft:amethyst_cluster minecraft:large_amethyst_bud minecraft:medium_amethyst_bud \
    minecraft:small_amethyst_bud minecraft:ochre_froglight minecraft:verdant_froglight \
    minecraft:pearlescent_froglight minecraft:glow_lichen minecraft:sculk_catalyst

# Fire and lava: a warm source, and the one block that should always look hot.
block.10005 = minecraft:lava minecraft:flowing_lava minecraft:fire minecraft:soul_fire \
    minecraft:campfire minecraft:soul_campfire minecraft:torch minecraft:wall_torch \
    minecraft:soul_torch minecraft:soul_wall_torch minecraft:lantern minecraft:soul_lantern \
    minecraft:magma_block minecraft:crying_obsidian minecraft:respawn_anchor

# Redstone: a dim red source, so a circuit reads at night without lighting the room.
block.10006 = minecraft:redstone_lamp minecraft:redstone_block minecraft:redstone_torch \
    minecraft:redstone_wall_torch
