# Starling Visuals 3.1: Starling's own shader pack, made for phones. Few full-screen passes, a
# light sky and lighting model, and a quality ladder the game's Auto profile can read.
#
# The four profiles are ranked by what they ask of the options, lightest first:
#   POTATO the most frames a phone can make: no post at all, 512 shadow map, 32 blocks of shadow
#   LOW    a weak phone: no contact shadows, no rays, no bloom, no night detail
#   HIGH   the defaults, and what Auto picks on a strong phone
#   ULTRA  a larger shadow map and the full sample counts, for a tablet or a PC
# Auto reads the ranking, not the names, so picking Auto lands on HIGH where the device can pay
# for it, on LOW where it cannot, and on POTATO where even LOW is too much.
screen = <profile> [Lighting] [Air] [Surfaces] [Sky] [Lens]
screen.columns = 2
screen.Lighting = SUN_STRENGTH SKY_BRIGHTNESS SKY_SATURATION BLOCKLIGHT_STRENGTH EXPOSURE shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS
screen.Air = FOG_DENSITY FOG_HEIGHT GODRAYS GODRAYS_STRENGTH GODRAYS_SAMPLES BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD
screen.Surfaces = SSAO SSAO_STRENGTH SSAO_SAMPLES SPECULAR WATER_WAVES WAVING_PLANTS EMISSIVE_BLOCKS HAND_LIGHT UNDERWATER_CAUSTICS
screen.Sky = STARS AURORA AURORA_STRENGTH
screen.Lens = TONEMAP SATURATION CONTRAST WARMTH COLOR_GRADE SMOOTH_EDGES SHARPEN SHARPEN_STRENGTH VIGNETTE VIGNETTE_STRENGTH FILM_GRAIN GRAIN_STRENGTH
sliders = SUN_STRENGTH SKY_BRIGHTNESS SKY_SATURATION BLOCKLIGHT_STRENGTH EXPOSURE SATURATION CONTRAST WARMTH FOG_DENSITY FOG_HEIGHT GODRAYS_STRENGTH BLOOM_STRENGTH BLOOM_THRESHOLD SSAO_STRENGTH SHARPEN_STRENGTH VIGNETTE_STRENGTH GRAIN_STRENGTH AURORA_STRENGTH shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS

profile.POTATO = !SSAO !GODRAYS !BLOOM !SPECULAR !STARS !AURORA !SHARPEN !SMOOTH_EDGES !VIGNETTE !FILM_GRAIN !UNDERWATER_CAUSTICS !EMISSIVE_BLOCKS !WATER_WAVES !WAVING_PLANTS !HAND_LIGHT !COLOR_GRADE shadowMapResolution=512 shadowDistance=32.0 SHADOW_SOFTNESS=0.5 SHADOW_FILTER=1 SSAO_SAMPLES=4 GODRAYS_SAMPLES=6 BLOOM_STRENGTH=0.03 FOG_DENSITY=0.0 AURORA_STRENGTH=0.0 EXPOSURE=0.8 TONEMAP=2
profile.LOW = !SSAO !GODRAYS !BLOOM !SPECULAR !STARS !AURORA !SHARPEN !SMOOTH_EDGES !VIGNETTE !FILM_GRAIN !UNDERWATER_CAUSTICS shadowMapResolution=512 shadowDistance=32.0 SHADOW_SOFTNESS=0.8 SHADOW_FILTER=1 SSAO_SAMPLES=4 GODRAYS_SAMPLES=6 BLOOM_STRENGTH=0.03 FOG_DENSITY=0.75 AURORA_STRENGTH=0.0 EXPOSURE=0.8
profile.HIGH = SSAO GODRAYS BLOOM SPECULAR STARS AURORA SHARPEN SMOOTH_EDGES VIGNETTE FILM_GRAIN UNDERWATER_CAUSTICS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SOFTNESS=1.2 SHADOW_FILTER=2 SSAO_SAMPLES=6 SSAO_STRENGTH=0.65 GODRAYS_SAMPLES=8 GODRAYS_STRENGTH=1.0 BLOOM_STRENGTH=0.07 BLOOM_THRESHOLD=0.85 FOG_DENSITY=1.0 AURORA_STRENGTH=0.4 SHARPEN_STRENGTH=0.18 VIGNETTE_STRENGTH=0.20 GRAIN_STRENGTH=0.015 EXPOSURE=0.9
profile.ULTRA = shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SOFTNESS=1.6 SHADOW_FILTER=4 SSAO_SAMPLES=10 SSAO_STRENGTH=0.75 GODRAYS_SAMPLES=12 GODRAYS_STRENGTH=1.4 BLOOM_STRENGTH=0.10 BLOOM_THRESHOLD=0.9 FOG_DENSITY=1.25 AURORA_STRENGTH=0.6 SHARPEN_STRENGTH=0.28 VIGNETTE_STRENGTH=0.28 GRAIN_STRENGTH=0.015 EXPOSURE=0.95


option.SUN_STRENGTH.comment = How bright the sun is at noon.
option.SKY_BRIGHTNESS.comment = The sky's own brightness, independent of the sun.
option.SKY_SATURATION.comment = How blue the day sky and how warm the horizon are.
option.BLOCKLIGHT_STRENGTH.comment = How far a torch or lantern reaches.
option.EXPOSURE.comment = The film curve's input gain.
option.SATURATION.comment = Colour strength after the film curve.
option.CONTRAST.comment = Contrast around middle grey.
option.WARMTH.comment = Negative is cooler and bluer, positive is warmer and amber.
option.FOG_DENSITY.comment = How thick the air is.
option.FOG_HEIGHT.comment = How many blocks up the haze thins to nothing.
option.shadowMapResolution.comment = Shadow detail. Auto caps this on a phone.
option.shadowDistance.comment = How far shadows reach. Auto caps this on a phone.
option.SHADOW_FILTER.comment = Shadow edge samples: 1, 2 or 4 taps.
option.SHADOW_SOFTNESS.comment = The width of the shadow edge, in shadow-map texels.
option.GODRAYS.comment = Light scattered toward the eye around the sun.
option.GODRAYS_STRENGTH.comment = The strength of the sun's rays.
option.GODRAYS_SAMPLES.comment = More samples is smoother and costs more.
option.BLOOM.comment = The glow around bright things.
option.BLOOM_STRENGTH.comment = How much of the glow is mixed in.
option.BLOOM_THRESHOLD.comment = How bright a pixel must be before it glows.
option.SSAO.comment = Soft contact shadows in corners and under objects.
option.SSAO_STRENGTH.comment = How dark the contact shadows get.
option.SSAO_SAMPLES.comment = More depth taps is smoother and costs more.
option.SPECULAR.comment = The sun's highlight on wet or polished surfaces.
option.WATER_WAVES.comment = Moving waves on open water.
option.WAVING_PLANTS.comment = Wind in grass and leaves, and in their shadows.
option.EMISSIVE_BLOCKS.comment = Glowing blocks light their own texture.
option.HAND_LIGHT.comment = A glowing item in the hand lights around the player.
option.UNDERWATER_CAUSTICS.comment = The net of light on the bottom when the eye is under water.
option.STARS.comment = Stars and the milky way at night.
option.AURORA.comment = Aurora curtains low in the night sky.
option.AURORA_STRENGTH.comment = The aurora's brightness.
option.TONEMAP.comment = 0 is ACES, 1 is a soft filmic curve, 2 is Reinhard.
option.COLOR_GRADE.comment = Cool shade and warm light, the pack's own grade.
option.SMOOTH_EDGES.comment = A light edge smooth for distant blocks and leaves.
option.SHARPEN.comment = A small unsharp mask for a phone's screen.
option.SHARPEN_STRENGTH.comment = How strong the unsharp mask is.
option.VIGNETTE.comment = A gentle darkening at the corners.
option.VIGNETTE_STRENGTH.comment = How dark the corners get.
option.FILM_GRAIN.comment = A little animated grain, like a film.
option.GRAIN_STRENGTH.comment = How much grain.
